[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
besi = { path = "crates/core" }
entity = { path = "crates/entity" }
migration = { path = "crates/migration" }
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }

# HTTP API (besi `api` feature)
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "time"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database (besi `db` feature). No macros/migrate yet: those come with SeaORM.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }

# ORM + migrations (besi `orm` feature). SeaORM 2 is built on the same sqlx 0.9
# as `sqlx` above; keep them in step when upgrading.
sea-orm = { version = "2", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "with-chrono", "with-json", "with-uuid"] }
sea-orm-migration = { version = "2", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }

# Scheduler (besi `cron` feature)
croner = "4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Test-only
tower = { version = "0.5", features = ["util"] }

# Used by `make prod`: smaller, faster binary at the cost of build time.
[profile.release]
lto = true
codegen-units = 1
strip = true
