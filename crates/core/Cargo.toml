[package]
name = "besi"
description = "Core framework: command trait, execution context, errors, and runner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
clap.workspace = true
config.workspace = true
dotenvy.workspace = true
serde.workspace = true
tokio.workspace = true

axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
croner = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
async-trait = "0.1"
tower.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[features]
# Opt-in: enable with `besi = { workspace = true, features = ["api"] }`.
default = []
# HTTP API server and the `api` command (axum).
api = ["dep:axum", "dep:tower-http", "dep:tracing", "dep:tracing-subscriber"]
# PostgreSQL connection pool (sqlx), available as `ctx.db()` / `state.db()`.
db = ["dep:sqlx"]
# SeaORM on the `db` pool (`db.orm()`) and the `migrate` command.
orm = ["db", "dep:sea-orm", "dep:sea-orm-migration"]
# Job scheduler and the `cron` command (croner).
cron = ["dep:croner", "dep:chrono", "dep:tokio-util", "dep:tracing", "dep:tracing-subscriber"]
